<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>달로 가는 노면전차</title>
<meta name="description" content="1990년대 OVA 셀 애니메이션 스타일 · 그림·움직임·소리를 모두 코드로 만든 80초 장면">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #ui{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#cfc4ab;
      font:15px/1.7 "Apple SD Gothic Neo","Malgun Gothic",serif;text-align:center;cursor:pointer;user-select:none}
  #ui b{display:block;font-size:40px;letter-spacing:.1em;margin-bottom:6px;color:#e8d9b5}
  #ui small{color:#7d7666}
  #ui.hide{display:none}
</style>
</head>
<body>
<canvas id="c" width="960" height="720"></canvas>
<div id="ui"><div id="msg">그림을 그리는 중…</div></div>
<script>
'use strict';
/* =====================================================================
   달로 가는 노면전차 — 1990년대 OVA 셀 애니메이션 스타일 (80초)
   · 모든 그림은 캔버스 2D로 직접 칠함 (이미지 파일 없음)
   · 캐릭터(전차·고양이)는 2프레임마다 새로 그림 = "on twos"
   · 소리는 Web Audio로 합성
   ===================================================================== */
const W=960,H=720,FPS=24,END=81.5;
const cv=document.getElementById('c'),X=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

/* ---------- 기본 도구 ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;};
const S=mk(W,H),SX=S.getContext('2d');      // 장면 버퍼
const T1=mk(W,H),T1X=T1.getContext('2d');   // 물웅덩이 반사용 복사본
const HL=mk(W/4,H/4),HLX=HL.getContext('2d');// 할레이션
const MK=mk(W,H),MKX=MK.getContext('2d');   // 마스크
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eout=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function hash(n){const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry(1);const seed=n=>{R=mulberry(n);};const rnd=(a=0,b=1)=>a+(b-a)*R();
let DS=0; // 그림 번호(2프레임마다 바뀜) → 선 떨림

function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const arr=c=>typeof c==='string'?hex(c):c;
const rgb=(a,al)=>al==null?`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`:`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
function mix(a,b,t){a=arr(a);b=arr(b);return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function vary(c,v){c=arr(c);const k=rnd(-v,v)*255;return rgb([c[0]+k+rnd(-v,v)*60,c[1]+k+rnd(-v,v)*60,c[2]+k+rnd(-v,v)*60]);}

/* ---------- 경로 도구 ---------- */
function bz(x0,y0,x1,y1,x2,y2,x3,y3,n=12){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push(u*u*u*x0+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x3,u*u*u*y0+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y3);}return o;}
function ar(cx,cy,rx,ry,a0,a1,n=16){const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push(cx+Math.cos(a)*rx,cy+Math.sin(a)*ry);}return o;}
const J=(...a)=>[].concat(...a);
function trace(c,p,closed=true){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);if(closed)c.closePath();}
function fill(c,p,col){trace(c,p);c.fillStyle=typeof col==='string'?col:rgb(col);c.fill();}
function bbox(p){let a=1e9,b=1e9,c2=-1e9,d=-1e9;for(let i=0;i<p.length;i+=2){a=Math.min(a,p[i]);c2=Math.max(c2,p[i]);b=Math.min(b,p[i+1]);d=Math.max(d,p[i+1]);}return{x:a,y:b,w:c2-a,h:d-b};}
function blob(x,y,rx,ry,n=16,ir=.25,flat=true){const o=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const r=1+(rnd()-.5)*2*ir;let yy=Math.sin(a)*ry*r;if(flat&&yy>0)yy*=.5;o.push(x+Math.cos(a)*rx*r,y+yy);}return o;}
function shift(p,dx,dy){return p.map((v,i)=>v+(i%2?dy:dx));}

/* 손으로 그린 선: 구간마다 굵기가 달라지고, 그림 번호마다 살짝 떨림 */
function ink(c,p,w=2,col='#120b14',o={}){
  const amp=o.boil??.55,sd=o.s??p.length*1.7;
  const q=new Array(p.length);
  for(let i=0;i<p.length;i++)q[i]=p[i]+(hash(sd+i*7.31+DS*13.7)-.5)*2*amp;
  if(o.closed)q.push(q[0],q[1]);
  const m=q.length/2;c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';
  for(let i=0;i<m-1;i++){
    let ww=w*(.72+.56*hash(sd+i*3.7+DS*.37));
    if(o.taper){const t=i/Math.max(1,m-2);ww*=.3+.7*Math.sin(Math.PI*clamp(t*.92+.04));}
    c.lineWidth=Math.max(.3,ww);c.beginPath();c.moveTo(q[2*i],q[2*i+1]);c.lineTo(q[2*i+2],q[2*i+3]);c.stroke();
  }
}
/* 포스터컬러 붓질 채우기 (배경용) */
function paint(c,p,col,o={}){
  c.save();trace(c,p);c.fillStyle=typeof col==='string'?col:rgb(col);c.fill();c.clip();
  const b=bbox(p);const n=Math.min(o.max??5000,(b.w*b.h)/(o.area??220)*(o.d??1));const ang=o.a??0;
  c.lineCap='round';
  for(let i=0;i<n;i++){
    const x=rnd(b.x-10,b.x+b.w+10),y=rnd(b.y-10,b.y+b.h+10);
    const a=ang+rnd(-(o.aj??.35),o.aj??.35),L=rnd(o.l0??6,o.l1??20);
    c.globalAlpha=rnd(o.al0??.12,o.al1??.4);c.strokeStyle=vary(col,o.v??.05);c.lineWidth=rnd(o.w0??1.5,o.w1??5);
    c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a)*L*.5+rnd(-2,2),y+Math.sin(a)*L*.5+rnd(-2,2),x+Math.cos(a)*L,y+Math.sin(a)*L);c.stroke();
  }
  c.restore();c.globalAlpha=1;
}
function glow(c,x,y,r,col,a=1){const g=c.createRadialGradient(x,y,0,x,y,r);const k=arr(col);g.addColorStop(0,rgb(k,a));g.addColorStop(.35,rgb(k,a*.35));g.addColorStop(1,rgb(k,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
/* 종이 질감 */
const PAPER=(()=>{const c=mk(256,256),g=c.getContext('2d'),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*60+(Math.random()<.02?-40:0);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);return c;})();
function paper(g,x,y,w,h,a=.08){g.save();g.globalCompositeOperation='overlay';g.globalAlpha=a;g.fillStyle=g.createPattern(PAPER,'repeat');g.fillRect(x,y,w,h);g.restore();}

/* ---------- 팔레트 ---------- */
const C={ink:'#120b14',cr:'#8e8a73',cr1:'#66634f',cr2:'#3a3934',tl:'#2b5657',tl1:'#1c3a40',tl2:'#10212a',roof:'#23272e',
  rust:'#7a3d1a',rust2:'#a95a25',moss:'#425f27',moss2:'#5d7c31',brass:'#8f6d2c',glass:'#0a1219',warm:'#ffcf7d',sod:'#ffad48',cyan:'#62d6ec',orange:'#ff9a44'};

/* =====================================================================
   1) 배경 레이어 (월드 좌표, 미리 칠해 둠)
   ===================================================================== */
const RAIL=619;                      // 레일 윗면 y
const LAMP={x:930,y:300};            // 나트륨 가로등 머리
const MOON={x:1350,y:120};
const PUD=[{x:760,y:668,rx:250,ry:30},{x:1205,y:705,rx:220,ry:44}];
function layer(x0,x1,y0,y1,bs,fn){const c=mk((x1-x0)*bs,(y1-y0)*bs),g=c.getContext('2d');g.setTransform(bs,0,0,bs,-x0*bs,-y0*bs);fn(g);g.setTransform(1,0,0,1,0,0);paper(g,0,0,c.width,c.height,.07);return{c,x0,x1,y0,y1};}
function drawL(c,L,f,cx,cy){const ox=(cx-800)*(1-f),oy=(cy-400)*(1-f)*.6;c.drawImage(L.c,L.x0+ox,L.y0+oy,L.x1-L.x0,L.y1-L.y0);}
const hillY=x=>330+Math.sin(x*.004)*30+Math.sin(x*.013)*12+(x>900?(x-900)*.4:0);
const wireY=x=>232+24*(1-Math.pow((x-600)/430,2));

function makeSky(clear){return layer(-700,2300,-420,640,.55,g=>{
  seed(clear?71:31);
  const gr=g.createLinearGradient(0,-420,0,640);
  if(clear){gr.addColorStop(0,'#03050c');gr.addColorStop(.45,'#0a1531');gr.addColorStop(.82,'#1b2750');gr.addColorStop(1,'#272f50');}
  else{gr.addColorStop(0,'#04060d');gr.addColorStop(.45,'#0b1326');gr.addColorStop(.82,'#18233c');gr.addColorStop(1,'#1f2a42');}
  g.fillStyle=gr;g.fillRect(-700,-420,3000,1060);
  paint(g,[-700,-420,2300,-420,2300,640,-700,640],clear?[16,26,56]:[14,22,40],{a:.04,l0:40,l1:120,w0:8,w1:20,al0:.04,al1:.12,v:.03,area:700});
  if(clear){
    for(let i=0;i<300;i++){const x=rnd(-700,2300),y=rnd(-420,330);g.fillStyle=`rgba(232,236,255,${rnd(.15,.85)})`;g.beginPath();g.arc(x,y,rnd(.4,1.4),0,7);g.fill();}
    glow(g,MOON.x,MOON.y,460,'#f2b766',.42);
    glow(g,MOON.x,MOON.y,130,'#ffe3a6',.6);
    const m=ar(MOON.x,MOON.y,46,46,0,Math.PI*2,40);
    paint(g,m,'#fff0c6',{a:.6,l0:6,l1:14,w0:2,w1:5,al0:.2,al1:.5,v:.03,area:30});
    for(let i=0;i<7;i++)fill(g,blob(MOON.x+rnd(-26,22),MOON.y+rnd(-24,22),rnd(5,13),rnd(4,9),10,.2,false),'rgba(214,180,120,.45)');
  }
  const N=clear?54:78;
  for(let i=0;i<N;i++){
    const x=rnd(-700,2300),y=rnd(-400,clear?400:430),rx=rnd(90,330),ry=rnd(28,92);
    let lit=null;
    if(clear){const dx=(x-MOON.x),dy=(y-MOON.y),d=Math.hypot(dx/1.5,dy);if(d<300)continue;if(d<760)lit={dx:-dx/Math.hypot(dx,dy),dy:-dy/Math.hypot(dx,dy),k:1-d/760};}
    const p=blob(x,y,rx,ry,22,.16);
    const base=clear?mix('#0a1128','#1b2546',rnd()):mix('#090f1e','#1d273f',rnd());
    if(lit){paint(g,p,mix('#262b4a','#b48c62',.15+lit.k*.45),{d:.8,l0:10,l1:30,w0:3,w1:8,al1:.35,area:200});paint(g,shift(p,-lit.dx*(10+lit.k*14),-lit.dy*(10+lit.k*14)),base,{d:.8,l0:14,l1:50,w0:4,w1:12,al0:.15,al1:.4,v:.05,area:260});g.save();trace(g,p);g.clip();glow(g,x+lit.dx*rx*.6,y+lit.dy*ry*.6,rx*.9,'#f0c486',.12+lit.k*.18);g.restore();}
    else{paint(g,p,clear?'#2a3150':'#28293a',{d:.4,area:400});paint(g,shift(p,0,-5),base,{d:.8,a:rnd(-.1,.1),l0:14,l1:50,w0:4,w1:12,al0:.15,al1:.4,v:.05,area:260});}
  }
  if(!clear){g.globalAlpha=.05;g.strokeStyle='#8fa4c8';g.lineWidth=1;for(let i=0;i<500;i++){const x=rnd(-700,2300),y=rnd(-420,600);g.beginPath();g.moveTo(x,y);g.lineTo(x-12,y+70);g.stroke();}g.globalAlpha=1;}
});}

function house(g,x,base,w,h,col,lit,detail){
  const top=base-h,kind=R();
  let body=[x,base,x+w,base,x+w,top,x,top];paint(g,body,col,{a:Math.PI/2,l0:4,l1:12,w0:1,w1:3,area:60,al1:.3});
  let roof;
  if(kind<.45)roof=[x-3,top+2,x+w+3,top+2,x+w*.5,top-h*.32-rnd(4,10)];
  else if(kind<.8)roof=[x-4,top+2,x+w+4,top+2,x+w-6,top-rnd(8,16),x+6,top-rnd(8,16)];
  else roof=[x-1,top,x+w+1,top,x+w+1,top-4,x-1,top-4];
  const rc=mix(col,'#05070d',.35);paint(g,roof,rc,{a:0,l0:3,l1:9,w0:1,w1:2.5,area:40,al1:.35});
  if(detail){g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=.8;const bb=bbox(roof);for(let yy=bb.y+3;yy<bb.y+bb.h;yy+=3.5){g.beginPath();g.moveTo(bb.x,yy);g.lineTo(bb.x+bb.w,yy);g.stroke();}
    g.strokeStyle='rgba(120,150,190,.18)';g.beginPath();g.moveTo(roof[0],roof[1]-1);g.lineTo(roof[roof.length-2],roof[roof.length-1]);g.stroke();}
  const rows=Math.max(1,Math.floor(h/18)),cols=Math.max(1,Math.floor(w/16));
  for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
    const wx=x+5+k*(w-8)/cols,wy=top+6+r*(h-10)/rows,ww=Math.max(3,(w-8)/cols-6),wh=Math.max(3,(h-10)/rows-7);
    if(R()<lit){const cc=R()<.82?mix('#f7b257','#ffd88c',R()):mix('#7fb3d9','#a8d0ff',R());g.fillStyle=rgb(cc);g.fillRect(wx,wy,ww,wh);glow(g,wx+ww/2,wy+wh/2,ww*2.2,cc,.25);}
    else{g.fillStyle='rgba(4,6,12,.45)';g.fillRect(wx,wy,ww,wh);}
  }
}
function makeTown(){return layer(-500,2100,200,660,1,g=>{
  seed(5);
  paint(g,[880,420,2100,420,2100,660,880,660],'#0b1427',{a:0,aj:.05,l0:20,l1:80,w0:1.5,w1:4,al1:.3,area:160});
  g.fillStyle='rgba(70,90,130,.25)';g.fillRect(880,421,1220,2);
  const hill=[-500,660];for(let x=-500;x<=1180;x+=30)hill.push(x,hillY(x));hill.push(1180,660);
  paint(g,hill,'#0a101d',{a:-.25,l0:10,l1:30,area:160});
  // 곶과 등대
  paint(g,[1500,430,1580,402,1700,396,1820,408,1900,430],'#090e19',{area:80});
  paint(g,[1652,396,1660,350,1668,350,1676,396],'#151b28',{area:20});glow(g,1664,350,30,'#ffe0a0',.7);
  for(let x=-500;x<1120;){const w=rnd(12,30),hh=rnd(10,26);house(g,x,hillY(x)+rnd(26,50),w,hh,mix('#0d1526','#121b30',R()),.14,false);x+=w+rnd(-3,7);}
  for(let x=-500;x<1010;){const w=rnd(44,100),hh=rnd(44,120);house(g,x,568+rnd(-5,5),w,hh,mix('#101a2c','#18233b',R()),.26,true);x+=w+rnd(-10,3);}
  // 멀리 가로등
  for(let i=0;i<14;i++){const x=rnd(-450,980),y=rnd(470,560);glow(g,x,y,24,'#ffb158',.45);g.fillStyle='#ffe2a8';g.fillRect(x-1,y-1,2,2);}
  // 전선 (뒤엉킨 선)
  g.strokeStyle='rgba(5,7,12,.85)';
  for(let i=0;i<9;i++){const y0=rnd(300,430),y1=rnd(300,430),sag=rnd(10,40),xa=rnd(-500,200),xb=rnd(500,1100);g.lineWidth=rnd(.8,1.6);g.beginPath();g.moveTo(xa,y0);g.quadraticCurveTo((xa+xb)/2,(y0+y1)/2+sag,xb,y1);g.stroke();}
});}
function makeMid(){return layer(-200,1800,140,660,1.15,g=>{
  seed(9);
  // 왼쪽 상점 건물 두 채
  const A=[-200,612,150,612,150,300,-200,300];paint(g,A,'#191f2f',{a:Math.PI/2,l0:6,l1:18,w0:2,w1:5,area:90});
  const B=[150,612,345,612,345,368,150,368];paint(g,B,'#1e2333',{a:Math.PI/2,l0:6,l1:18,w0:2,w1:5,area:90});
  paint(g,[-210,300,160,300,150,286,-200,286],'#0d1019',{area:40});paint(g,[140,368,355,368,345,352,150,352],'#0f121b',{area:40});
  // 셔터
  for(const [x0,x1] of [[-170,120],[170,330]]){paint(g,[x0,612,x1,612,x1,520,x0,520],'#262a33',{a:0,aj:.02,l0:20,l1:60,w0:1,w1:2,area:60});g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1;for(let y=524;y<612;y+=5){g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();}g.strokeStyle='rgba(140,170,210,.12)';for(let y=526;y<612;y+=5){g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();}}
  // 차양과 간판(읽을 수 없는 칠한 모양)
  paint(g,[-180,520,130,520,140,506,-170,506],'#3a2a2f',{area:30});
  paint(g,[-150,470,90,470,90,430,-150,430],'#2a1c2c',{area:40});
  for(let i=0;i<5;i++){const x=-135+i*44;fill(g,blob(x+12,450,rnd(8,13),rnd(9,13),9,.35,false),'rgba(255,120,190,.85)');}
  glow(g,-30,450,170,'#ff6fb4',.28);
  paint(g,[185,505,320,505,320,486,185,486],'#1d3a3d',{area:30});for(let i=0;i<4;i++)fill(g,blob(205+i*32,495,10,6,8,.4,false),'rgba(120,255,230,.7)');glow(g,250,495,120,'#71f0de',.18);
  // 위층 창(하나는 커튼 너머 불빛)
  for(const [x,y,l] of [[-150,330,0],[-60,330,1],[30,330,0],[190,390,0],[270,390,0]]){g.fillStyle=l?'#c98a45':'#0b0e16';g.fillRect(x,y,52,64);if(l){glow(g,x+26,y+32,90,'#ffb45a',.3);fill(g,[x,y,x+20,y,x+14,y+64,x,y+64],'rgba(120,60,40,.6)');}g.strokeStyle='#07090e';g.lineWidth=3;g.strokeRect(x,y,52,64);}
  // 에어컨 실외기, 배관

const FTRACK=(()=>{const b=bz(240,700,1500,640,2300,430,3300,60,160);const pts=[];for(let i=0;i<b.length;i+=2)pts.push([b[i],b[i+1]]);const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,cum,len:cum[cum.length-1]};})();
function fAt(d){const {pts,cum}=FTRACK;d=clamp(d,0,FTRACK.len);let i=1;while(i<cum.length-1&&cum[i]<d)i++;const t=(d-cum[i-1])/(cum[i]-cum[i-1]||1);const a=pts[i-1],b=pts[i];return{x:lerp(a[0],b[0],t),y:lerp(a[1],b[1],t),ang:Math.atan2(b[1]-a[1],b[0]-a[0])};}

  rain(c,{n:220,al:.8,gold:{x:st.px,y:st.py-60,r:240}});
}

    if(t<75.1){fade=0;}fade=Math.max(fade,seg(t,79.4,81));
  }
  if(t>=74.98&&t<75.1){SX.setTransform(1,0,0,1,0,0);SX.fillStyle='rgba(255,236,200,.6)';SX.fillRect(0,0,W,H);}
  film(frame,fade);
}

/* =====================================================================
   10) 소리 (Web Audio 합성)
   ===================================================================== */
let AC=null,t0=0,NB=null,MASTER=null,REV=null,state='load';
function mkNoise(sec){const b=AC.createBuffer(2,AC.sampleRate*sec,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=w*.85+l*3;}}return b;}
function mkImpulse(sec){const b=AC.createBuffer(2,AC.sampleRate*sec,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.6);}return b;}
function out(rev=0,pan=0){const g=AC.createGain(),p=AC.createStereoPanner();p.pan.value=pan;g.connect(p);p.connect(MASTER);if(rev){const s=AC.createGain();s.gain.value=rev;g.connect(s);s.connect(REV);}return g;}
function nz(at,dur,o={}){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,at);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,at+dur);f.Q.value=o.q??1;const g=AC.createGain();g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(o.vol??.3,at+(o.a??.005));g.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(f);f.connect(g);g.connect(out(o.rev||0,o.pan||0));s.start(at,Math.random()*3);s.stop(at+dur+.1);}
function osc(at,dur,o={}){const s=AC.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f||440,at);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,at+dur);s.detune.value=o.det||0;const g=AC.createGain();const a=o.a??.01,r=o.r??dur*.6;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(o.vol??.1,at+a);g.gain.setValueAtTime(o.vol??.1,at+Math.max(a,dur-r));g.gain.exponentialRampToValueAtTime(.0001,at+dur);let node=s;if(o.lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;s.connect(f);node=f;}node.connect(g);g.connect(out(o.rev||0,o.pan||0));s.start(at);s.stop(at+dur+.05);}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function bell(at){for(const [k,a] of [[1,.16],[2.32,.08],[2.76,.07],[4.1,.04],[5.4,.03]])osc(at,2.4,{f:1180*k,vol:a,a:.002,r:2.3,rev:.5,pan:.15});}
function buildAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();NB=mkNoise(4);
  MASTER=AC.createGain();MASTER.gain.value=.85;const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;MASTER.connect(comp);comp.connect(AC.destination);
  REV=AC.createConvolver();REV.buffer=mkImpulse(3.2);const rg=AC.createGain();rg.gain.value=.55;REV.connect(rg);rg.connect(MASTER);
  const T=AC.currentTime+.2;t0=T;
  // 빗소리 (두 겹) — 컷에 따라 크기·밝기가 바뀜
  for(const [hp,lp,base] of [[700,7000,1],[120,900,.8]]){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const h=AC.createBiquadFilter();h.type='highpass';h.frequency.value=hp;const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;const g=AC.createGain();g.gain.value=0;s.connect(h);h.connect(l);l.connect(g);g.connect(MASTER);s.start(T);
    const lv=[[0,0],[1.6,.34],[13,.34],[27,.10],[34,.16],[39,.3],[46,.32],[55,.3],[63,.16],[71,.1],[75,.22],[79.5,.06],[81.5,0]];for(const [tt,v] of lv)g.gain.linearRampToValueAtTime(v*base,T+tt);
    if(lp>1000){l.frequency.setValueAtTime(7000,T+26.9);l.frequency.setValueAtTime(1300,T+27);l.frequency.setValueAtTime(3200,T+34);l.frequency.setValueAtTime(7000,T+39);}}
  // 가로등 웅웅거림 (깜빡일 때 끊김)
  {const s=AC.createOscillator();s.type='sawtooth';s.frequency.value=120;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=240;f.Q.value=3;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(MASTER);s.start(T);
    for(let k=0;k<21*12;k++){const tt=k/12;const v=(tt<8||tt>13&&tt<21)?.035:.015;g.gain.setValueAtTime(lampFlick(tt)<.5?0:v,T+tt);}g.gain.setValueAtTime(0,T+21);s.stop(T+21.2);}
  // 천둥
  nz(T+4.6,4,{type:'lowpass',f:700,f2:80,vol:.45,a:.2,rev:.4});
  nz(T+13.5,.35,{type:'highpass',f:2200,vol:.6,rev:.3});nz(T+13.55,6,{type:'lowpass',f:1200,f2:60,vol:1,a:.05,rev:.5});
  // 고양이
  nz(T+17.75,.35,{type:'highpass',f:3500,vol:.09});for(let i=0;i<7;i++)nz(T+17.9+i*.11,.05,{f:1800,q:3,vol:.12,pan:-.3-i*.08});
  // 집전장치: 끼익 (세 단계) → 접촉 → 불꽃
  for(const [a,d] of [[21.5,.7],[22.6,.5],[23.2,.35]]){osc(T+a,d,{type:'sawtooth',f:1700,f2:2600,vol:.035,lp:4000,a:.05});nz(T+a,d,{f:3000,q:8,vol:.12,a:.05});}
  nz(T+23.45,.35,{type:'lowpass',f:400,vol:.6});
  for(let i=0;i<70;i++){const at=23.5+Math.random()*2.8;nz(T+at,.03+Math.random()*.06,{type:'highpass',f:2500,vol:.12+Math.random()*.25,pan:(Math.random()-.5)*.6});}
  osc(T+23.5,2.8,{type:'sawtooth',f:100,vol:.05,lp:1500,a:.02,r:.3});
  // 실내등 릴레이 딸깍 + 형광 웅웅
  for(const L of LAMPS_IN){nz(T+L.on,.025,{f:2600,q:4,vol:.35});nz(T+L.on+.18,.02,{f:2600,q:4,vol:.2});nz(T+L.on+.37,.02,{f:2600,q:4,vol:.25});}
  osc(T+28.2,5.8,{type:'triangle',f:100,vol:.02,a:2,r:.5});
  // 방향막 딸깍딸깍
  {let tt=34.6;while(tt<38){const sp=Math.abs(rollerOffset(tt+.02)-rollerOffset(tt))/.02;const dt=clamp(PANEL/Math.max(1,sp)*.5,.035,.3);nz(T+tt,.02,{f:3200,q:6,vol:.25});tt+=dt;}nz(T+38,.08,{type:'lowpass',f:800,vol:.6});nz(T+34.3,.03,{f:2400,q:4,vol:.3});}
  // 모터의 신음, 녹 깨짐, 덩굴 찢어짐
  {const s=AC.createOscillator();s.type='sawtooth';s.frequency.setValueAtTime(30,T+39);s.frequency.linearRampToValueAtTime(42,T+42);s.frequency.linearRampToValueAtTime(36,T+43);s.frequency.linearRampToValueAtTime(62,T+46);
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=280;const g=AC.createGain();g.gain.setValueAtTime(0,T+39);g.gain.linearRampToValueAtTime(.32,T+40);g.gain.setValueAtTime(.32,T+45.6);g.gain.linearRampToValueAtTime(0,T+46.3);s.connect(f);f.connect(g);g.connect(out(.2));s.start(T+39);s.stop(T+46.5);}
  for(let i=0;i<6;i++)nz(T+39.5+i*1.1,.6,{f:700,f2:1300,q:12,vol:.12,rev:.2});
  for(const f0 of FLAKES){nz(T+f0,.14,{type:'lowpass',f:2200,vol:.5});nz(T+f0+.05,.4,{type:'highpass',f:5000,vol:.05});}
  for(const w of WIVY)nz(T+w.tear,.35,{f:900,f2:2600,q:2,vol:.22});
  // 빛의 선로가 엮일 때마다 맑은 음
  const pent=[74,76,78,81,83,86,88,90,93,95];for(let k=0;k<SLEEPERS;k++)osc(T+sleeperT(k),1.4,{f:mtof(pent[k%pent.length]+(k>=10?0:0)),vol:.035,a:.005,r:1.3,rev:.6,pan:-.4+k*.03});
  nz(T+47,8,{f:6000,q:.7,vol:.03,a:4,rev:.5});
  // 출발: 덜컹 리듬이 빨라지다가 빛의 선로 위에서 사라짐
  osc(T+55.4,4,{type:'sawtooth',f:45,f2:110,vol:.16,lp:500,a:.6,r:1.2});
  {let d=60;while(true){const tt=55.6+Math.sqrt(2*d/40);if(tt>60)break;nz(T+tt,.06,{type:'lowpass',f:900,vol:.35});nz(T+tt+.07,.05,{type:'lowpass',f:900,vol:.25});d+=60;}}
  for(const b of BELLS)bell(T+b);
  // 음악: 따뜻한 신스 패드 (46초부터)
  const CH=[[46,50.5,[50,57,62,65,69]],[50.5,55,[46,53,57,62,65]],[55,58.6,[43,50,55,58,62]],[58.6,63,[48,55,58,62,65]],[63,67,[41,48,57,60,64]],[67,71,[50,57,62,65,69]],[71,75,[46,53,57,62,69]],[75,81.5,[41,48,57,60,64,67]]];
  for(const [a,b,notes] of CH){const v=a<55?.018:a<63?.026:.032;for(const n of notes){for(const det of [-7,7]){osc(T+a,b-a+1.6,{type:'sawtooth',f:mtof(n),det,vol:v,a:1.4,r:1.8,lp:a<63?900:1500,rev:.4});}}}
  const MEL=[[63.2,72,.6],[63.8,74,.6],[64.4,76,1.1],[65.6,79,1.4],[67.2,77,.6],[67.8,76,.6],[68.4,74,1.2],[69.8,72,.6],[70.4,74,.6],[71,76,1.6],[72.8,81,1.2],[74.2,79,2.2],[76.6,76,1.4],[78.2,72,2.6]];
  for(const [a,n,d] of MEL){osc(T+a,d+.6,{type:'triangle',f:mtof(n),vol:.05,a:.04,r:d*.7,rev:.5});osc(T+a,d+.6,{type:'sine',f:mtof(n+12),vol:.012,a:.04,r:d*.7,rev:.5});}
  // 구름을 가르는 바람, 끝의 별빛
  nz(T+71,4,{f:300,f2:1600,q:.8,vol:.28,a:1.5,rev:.3});
  for(const [a,n] of [[76.4,96],[77.2,100],[78,103],[79,108]])osc(T+a,2,{f:mtof(n),vol:.018,a:.005,r:1.9,rev:.7});
  // 마지막 고양이 울음
  osc(T+78.4,.55,{type:'triangle',f:640,f2:520,vol:.04,lp:2500,a:.05});
}

/* =====================================================================
   11) 재생 제어
   ===================================================================== */
const ui=document.getElementById('ui'),msg=document.getElementById('msg');
let lastFrame=-1,paused=false,tPause=0,mute=false,tStartPerf=0;
function clock(){if(AC&&!mute)return AC.currentTime-t0;return (performance.now()-tStartPerf)/1000;}
function loop(){if(state!=='play')return;const t=clock();if(t>=END){state='end';ui.classList.remove('hide');msg.innerHTML='<b>↻</b>다시 보기';return;}
  const f=Math.floor(Math.max(0,t)*FPS);if(f!==lastFrame){lastFrame=f;render(Math.max(0,t));}requestAnimationFrame(loop);}
function start(){if(AC){try{AC.close();}catch(e){}}try{buildAudio();mute=false;}catch(e){mute=true;tStartPerf=performance.now();}
  state='play';lastFrame=-1;ui.classList.add('hide');requestAnimationFrame(loop);}
ui.addEventListener('click',()=>{if(state==='ready'||state==='end')start();});
addEventListener('keydown',e=>{if(e.code==='Space'&&state==='play'&&AC){e.preventDefault();if(AC.state==='running')AC.suspend();else AC.resume();}if(e.key==='r'||e.key==='R'){if(state!=='load')start();}});
/* 확인용: 주소 끝에 #t=12.5 를 붙이면 그 시점의 한 장면을 멈춰서 보여 줌 */
window.renderAt=t=>{render(t);};
setTimeout(()=>{
  SKY1=makeSky(false);SKY2=makeSky(true);TOWN=makeTown();MID=makeMid();NEAR=makeNear();
  INT_D=makeInterior(false);INT_L=makeInterior(true);ROLL=makeRoller();RBG=makeRollerBg();WBG=makeWheelBg();WHEEL=makeWheel();
  FSKY=makeFlightSky();FFAR=makeRoofs(2600,470,.8,52,.22);FNEAR=makeRoofs(3400,560,1.25,53,.3);CL_L=makeCloudCel(-1);CL_R=makeCloudCel(1);
  const m=location.hash.match(/t=([\d.]+)/);
  if(m){ui.classList.add('hide');render(parseFloat(m[1]));state='still';return;}
  state='ready';msg.innerHTML='<b>▶</b>클릭하면 재생됩니다 · 소리 있음 · 약 80초<br><small>Space 일시정지 · R 처음부터</small>';
  render(0.0001);
},30);
