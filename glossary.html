<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 용어집</title>
<meta name="description" content="영상 제작과 AI 영상 용어를 전후 비교 그림으로 정리한 용어집 · 기초와 심화">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/guide.css">
<style>
  .levels{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-top:18px}
  .levels button{border:0;background:transparent;font:600 15px var(--f-body);padding:9px 20px;border-radius:999px;cursor:pointer;color:var(--muted)}
  .levels button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .levels button .c{font:500 12px var(--f-mono);opacity:.8;margin-left:4px}
  .lvnote{margin:10px 0 0;font-size:14px;color:var(--muted)}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
  .tools input{max-width:280px}
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .cats a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:5px 12px;border-radius:999px;background:var(--surface)}
  .cats a:hover{border-color:var(--accent)}
  .cats a .n{font:500 11px var(--f-mono);color:var(--muted);margin-left:4px}
  .gsec{margin-top:44px}
  .gsec h2 small{font:500 12px var(--f-mono);letter-spacing:.06em}
  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
  .term{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .term.adv{border-color:#d9cdf7;background:linear-gradient(180deg,#faf8ff,#fff)}
  .term h3{margin:0;font-size:18px;line-height:1.3;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .term h3 .en{display:block;font:500 12px var(--f-mono);color:var(--muted);margin-top:2px}
  .badge-adv{flex:none;font:600 11px var(--f-body);color:#6b45d9;background:#efe8ff;border-radius:6px;padding:2px 7px;margin-top:3px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pair figure{margin:0;display:flex;flex-direction:column;gap:4px}
  .pair canvas{width:100%;aspect-ratio:16/9;border-radius:6px;background:#eef1f6;display:block}
  .pair figcaption{font-size:12px;color:var(--muted);line-height:1.35}
  .pair figcaption b{font:600 10px var(--f-mono);letter-spacing:.06em;margin-right:5px;color:var(--ink)}
  .pair .after figcaption b{color:var(--accent)}
  .term p{margin:0;font-size:14.5px;line-height:1.65}
  .term .tip{font-size:13.5px;color:var(--muted);border-left:3px solid var(--mark);padding-left:10px}
  .term .tip strong{color:var(--ink)}
  .term .more{display:none;font-size:13.5px;background:#f3efff;border-radius:8px;padding:10px 12px;color:#3d2a7a}
  .term .more strong{color:#6b45d9}
  body.adv .term .more{display:block}
  body:not(.adv) .term.adv{display:none}
  .term.hit-none{display:none!important}
  .gsec.empty{display:none}
  @media (prefers-reduced-motion:no-preference){body.adv .term.adv{animation:pop .35s ease}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div id="topbar"></div>
<main class="wrap">
  <div class="hero">
    <div class="eyebrow">용어집 · 전후 비교로 보는 영상 언어</div>
    <h1>영상 <mark>용어집</mark></h1>
    <p class="lede">용어마다 적용 <b>전(BEFORE)</b>과 <b>후(AFTER)</b>를 그림으로 나란히 보여 줍니다. 그림은 모두 자바스크립트로 그렸고, 카메라 무빙처럼 움직임이 중요한 용어는 그림이 직접 움직입니다.</p>
    <div class="levels" role="group" aria-label="난이도">
      <button id="bBasic" aria-pressed="true">기초<span class="c" id="cBasic"></span></button>
      <button id="bAdv" aria-pressed="false">심화<span class="c" id="cAdv"></span></button>
    </div>
    <p class="lvnote" id="lvnote"></p>
    <div class="tools"><input type="text" id="q" placeholder="용어 찾기 (예: 돌리, 디졸브, fps)" aria-label="용어 찾기"></div>
    <nav class="cats" id="cats" aria-label="분류"></nav>
  </div>
  <div id="main"></div>
</main>
<footer>한음쌤의 영상 실습 도우미 · 영상 용어집</footer>
<script src="assets/guide.js"></script>
<script>
'use strict';
/* =====================================================================
   그림 도구 — 모든 그림은 192×108(16:9) 좌표계에서 그림
   ===================================================================== */
const CW=192,CH=108;
const K={sky1:'#a9c9f2',sky2:'#e6f0fb',gr1:'#9cc48a',gr2:'#7aa968',wall:'#efe5d4',floor:'#caa47c',ink:'#2a2f45',skin:'#f2c9a3',shirt:'#3d7bf7',pants:'#2b3352',pink:'#ec5f9b',sun:'#ffcf5a',dark:'#1d2133',paper:'#f4f1ea',hair:'#2a2230',mute:'#8e94ab'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const tri=(t,p=3)=>{const u=(t%p)/p;return u<.5?u*2:2-u*2;};      // 0→1→0 왕복
const saw=(t,p=3)=>(t%p)/p;
function hash(n){const s=Math.sin(n*12.9898+78.233)*43758.5453;return s-Math.floor(s);}
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
function rr(c,x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);c.fill();}
function line(c,x0,y0,x1,y1,col=K.ink,w=1.5){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();}
function arrow(c,x0,y0,x1,y1,col=K.pink,w=2){line(c,x0,y0,x1,y1,col,w);const a=Math.atan2(y1-y0,x1-x0);c.fillStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-7*Math.cos(a-.45),y1-7*Math.sin(a-.45));c.lineTo(x1-7*Math.cos(a+.45),y1-7*Math.sin(a+.45));c.fill();}
function text(c,s,x,y,o={}){c.font=`${o.b===false?'':'700 '}${o.size||10}px "IBM Plex Sans KR",sans-serif`;c.fillStyle=o.col||K.ink;c.textAlign=o.al||'center';c.textBaseline='middle';c.fillText(s,x,y);}
function sky(c,top=K.sky1,bot=K.sky2,gy=78){const g=c.createLinearGradient(0,0,0,gy);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(-400,-400,1000,gy+400);rect(c,-400,gy,1000,400,K.gr1);rect(c,-400,gy,1000,3,K.gr2);}
function room(c){rect(c,-400,-400,1000,480,K.wall);rect(c,-400,80,1000,400,K.floor);rect(c,-400,79,1000,2,'#b08860');}
function paper(c){rect(c,0,0,CW,CH,K.paper);}
function mountains(c){c.fillStyle='#8fb0d8';c.beginPath();c.moveTo(-120,78);c.lineTo(-60,42);c.lineTo(0,70);c.lineTo(50,38);c.lineTo(110,72);c.lineTo(160,40);c.lineTo(230,70);c.lineTo(300,48);c.lineTo(320,78);c.fill();}
function tree(c,x,y,h=34){rect(c,x-2,y-h*.45,4,h*.45,'#7a5434');circ(c,x,y-h*.62,h*.3,'#4f9a5a');circ(c,x-h*.16,y-h*.5,h*.22,'#5cae66');circ(c,x+h*.17,y-h*.52,h*.2,'#468a50');}
function house(c,x,y,w=34,h=24){rect(c,x,y-h,w,h,'#f6e3c4');c.fillStyle='#d0614a';c.beginPath();c.moveTo(x-3,y-h);c.lineTo(x+w/2,y-h-14);c.lineTo(x+w+3,y-h);c.fill();rect(c,x+w*.4,y-h*.55,w*.22,h*.55,'#8a5a3a');rect(c,x+4,y-h+5,7,7,'#9fd0f0');}
function sun(c,x,y,r=8){circ(c,x,y,r*1.9,'rgba(255,207,90,.25)');circ(c,x,y,r,K.sun);}
/* 사람: (x, 발끝 y), 키 h. o.face: 1 오른쪽, -1 왼쪽, 0 정면 / o.col 옷색 / o.dark 실루엣 / o.mouth 0~1 */
function person(c,x,y,h=44,o={}){const s=h/44,face=o.face??0,dark=o.dark;
  const skin=dark?'#20232f':K.skin,shirt=dark?'#20232f':(o.col||K.shirt),pants=dark?'#20232f':K.pants,hair=dark?'#20232f':K.hair;
  rect(c,x-6*s,y-18*s,5*s,18*s,pants);rect(c,x+1*s,y-18*s,5*s,18*s,pants);
  rr(c,x-9*s,y-34*s,18*s,18*s,4*s,shirt);
  rect(c,x-12*s,y-32*s,4*s,13*s,shirt);rect(c,x+8*s,y-32*s,4*s,13*s,shirt);
  circ(c,x,y-39*s,6*s,skin);c.fillStyle=hair;c.beginPath();c.arc(x,y-40*s,6.2*s,Math.PI,Math.PI*2);c.fill();
  if(!dark){const ex=face*2.2*s;circ(c,x-2*s+ex,y-39*s,.9*s,K.ink);circ(c,x+2*s+ex,y-39*s,.9*s,K.ink);
    if(o.mouth!=null){rr(c,x-1.6*s+ex,y-36.4*s,3.2*s,(0.6+o.mouth*1.8)*s,.8*s,'#b23a48');}else{c.strokeStyle='#b23a48';c.lineWidth=.8*s;c.beginPath();c.arc(x+ex,y-37*s,1.6*s,.2,Math.PI-.2);c.stroke();}}}
function scene(c){sky(c);mountains(c);sun(c,150,24);house(c,18,78);tree(c,170,78);tree(c,-30,78,40);tree(c,250,78,30);person(c,96,80,44);}
function view(c,cx,cy,z,fn,rot=0){c.save();c.translate(CW/2,CH/2);c.rotate(rot);c.scale(z,z);c.translate(-cx,-cy);fn();c.restore();}
function frameBox(c,x,y,w,h,col=K.ink){c.strokeStyle=col;c.lineWidth=1.5;c.strokeRect(x,y,w,h);}
function cam(c,x,y,a=0,col=K.ink){c.save();c.translate(x,y);c.rotate(a);rr(c,-7,-5,12,10,2,col);c.fillStyle=col;c.beginPath();c.moveTo(5,-3);c.lineTo(10,-6);c.lineTo(10,6);c.lineTo(5,3);c.fill();c.restore();}
function grid3(c,col='rgba(255,255,255,.85)'){c.strokeStyle=col;c.lineWidth=1;c.setLineDash([3,3]);for(const k of [1,2]){line(c,CW*k/3,0,CW*k/3,CH,col,1);line(c,0,CH*k/3,CW,CH*k/3,col,1);}c.setLineDash([]);}
function wave(c,x,y,w,h,amp,col,sd=1){c.strokeStyle=col;c.lineWidth=1.2;c.beginPath();for(let i=0;i<=w;i+=1.5){const a=typeof amp==='function'?amp(i/w):amp;const v=(hash(i*.37+sd)*2-1)*a*h/2;c.moveTo(x+i,y-v);c.lineTo(x+i,y+v);}c.stroke();}
function track(c,y,label,clips,col){text(c,label,14,y+6,{size:8,col:K.mute});for(const [x0,x1,cc,lab] of clips){rr(c,x0,y,x1-x0,12,3,cc||col);if(lab)text(c,lab,(x0+x1)/2,y+6,{size:7,col:'#fff'});}}
function blurDraw(c,px,fn){c.save();c.filter=`blur(${px}px)`;fn();c.restore();c.filter='none';}
function flat(c,col){rect(c,0,0,CW,CH,col);}
function ball(c,x,y,r=7,col=K.pink){circ(c,x,y,r,col);circ(c,x-r*.35,y-r*.35,r*.3,'rgba(255,255,255,.6)');}
function film(c,x,y,w,h,n,fn){for(let i=0;i<n;i++){const fx=x+i*(w/n);rect(c,fx,y,w/n-3,h,'#fff');c.save();c.beginPath();c.rect(fx,y,w/n-3,h);c.clip();fn(i,fx,y,w/n-3,h);c.restore();frameBox(c,fx,y,w/n-3,h,'#9aa1b8');}}

/* =====================================================================
   용어 데이터
   lv:1 기초 / lv:2 심화(심화를 누르면 추가) · x: 심화를 누르면 기초 카드에 붙는 설명
   b/a: 전·후 그림 설명 · d: 뜻 · t: 팁 · anim: 그림이 움직임
   ===================================================================== */
const CATS=[
 {id:'structure',name:'영상의 구조',en:'STRUCTURE'},
 {id:'size',name:'샷 사이즈',en:'SHOT SIZE'},
 {id:'angle',name:'앵글',en:'ANGLE'},
 {id:'move',name:'카메라 무빙',en:'CAMERA MOVE'},
 {id:'comp',name:'구도와 빛',en:'COMPOSITION & LIGHT'},
 {id:'edit',name:'편집',en:'EDITING'},
 {id:'sound',name:'소리',en:'SOUND'},
 {id:'spec',name:'규격과 파일',en:'FORMAT & FILE'},
 {id:'ai',name:'AI 영상',en:'AI VIDEO'},
 {id:'code',name:'애니메이션·코드 영상',en:'ANIMATION & CODE'},
];
const ballScene=(c,x)=>{paper(c);rect(c,0,84,CW,24,'#ddd6c8');ball(c,x,74,9);};
const TERMS=[
/* ---------- 영상의 구조 ---------- */
{cat:'structure',lv:1,ko:'프레임',en:'Frame',b:'사진 한 장',a:'여러 장이 이어짐',
 d:'영상을 이루는 정지된 사진 한 장입니다. 사진이 빠르게 넘어가면 움직이는 것처럼 보여요. 플립북과 같은 원리입니다.',
 x:'<strong>한 걸음 더</strong> 프레임 사이 변화가 작을수록 부드럽고, 크면 뚝뚝 끊겨 보입니다. AI 영상의 "깜빡임(flicker)"은 프레임마다 그림이 미세하게 바뀌어서 생겨요.',
 anim:1,draw(c,a,t){if(!a){ballScene(c,96);return;}paper(c);film(c,6,20,180,60,5,(i,x,y,w,h)=>{rect(c,x,y+44,w,16,'#ddd6c8');ball(c,x+8+i*((w-16)/4)+ (saw(t,1.2)*0),y+36-Math.sin(i/4*Math.PI)*24,6);});text(c,'1  2  3  4  5',96,92,{size:9,col:K.mute});}},
{cat:'structure',lv:1,ko:'fps, 프레임레이트',en:'Frames Per Second',b:'초당 6장',a:'초당 24장',
 d:'1초에 들어가는 프레임 수입니다. 24fps는 영화 같은 느낌, 30fps는 일반 영상·수업 영상, 60fps 이상은 부드러운 움직임과 슬로모션에 씁니다.',
 x:'<strong>한 걸음 더</strong> 슬로모션은 높은 fps로 찍은 뒤 느린 fps로 재생해 만듭니다. 120fps로 찍어 30fps로 틀면 4배 느려져요. 촬영 fps와 편집 프로젝트 fps가 다르면 끊김이 생길 수 있습니다.',
 anim:1,draw(c,a,t){const f=a?24:6;const tt=Math.floor(t*f)/f;ballScene(c,30+tri(tt,2.4)*132);text(c,a?'24fps':'6fps',170,14,{size:10,col:K.pink});}},
{cat:'structure',lv:1,ko:'샷, 컷',en:'Shot / Cut',b:'끊김 없이 한 덩어리',a:'컷으로 이어 붙임',
 d:'카메라가 켜지고 꺼질 때까지 끊김 없이 찍힌 한 덩어리입니다. 편집에서 샷과 샷을 잇는 지점을 "컷"이라고 해요.',
 x:'<strong>한 걸음 더</strong> 영상 문법에서 샷은 "한 번의 시선"입니다. 샷이 바뀔 때마다 시청자의 시선도 새로 시작하므로, 샷을 바꿀 이유(새 정보·반응·강조)가 있을 때 자르세요.',
 draw(c,a){paper(c);if(!a){rr(c,14,40,164,28,4,K.shirt);text(c,'샷 1 (끊김 없이)',96,54,{col:'#fff'});return;}const cols=[K.shirt,'#7c5cf0',K.pink];[14,72,130].forEach((x,i)=>{rr(c,x,40,52,28,4,cols[i]);text(c,'샷 '+(i+1),x+26,54,{col:'#fff'});});line(c,68,32,68,76,K.ink,1.5);line(c,126,32,126,76,K.ink,1.5);text(c,'컷',68,26,{size:9});text(c,'컷',126,26,{size:9});}},
{cat:'structure',lv:1,ko:'신, 장면',en:'Scene',b:'장소가 섞임',a:'장소·시간으로 묶음',
 d:'같은 장소·같은 시간에 일어나는 샷들의 묶음입니다. 장소나 시간이 바뀌면 새 신이 시작돼요.',
 x:'<strong>한 걸음 더</strong> 신이 바뀔 때는 시청자가 "여기가 어디지?"를 알 수 있게 설정 샷이나 소리(종소리·바람)로 장소를 먼저 알려 주면 좋습니다.',
 draw(c,a){paper(c);const s=[['교실','#f6e3c4'],['운동장','#cfe8c0'],['교실','#f6e3c4'],['운동장','#cfe8c0']];const order=a?[0,2,1,3]:[0,1,2,3];order.forEach((k,i)=>{rr(c,10+i*45,36,40,30,3,s[k][1]);text(c,s[k][0],30+i*45,51,{size:9});});if(a){frameBox(c,7,30,93,42,K.pink);frameBox(c,97,30,93,42,'#7c5cf0');text(c,'신 1',53,22,{col:K.pink});text(c,'신 2',143,22,{col:'#7c5cf0'});}}},
{cat:'structure',lv:1,ko:'테이크',en:'Take',b:'한 번만 촬영',a:'여러 번 중 베스트',
 d:'같은 샷을 얻기 위한 촬영 시도 번호입니다. 샷 3을 네 번 찍었다면 샷 3, 테이크 1~4가 되고, 편집할 때 가장 잘 나온 하나만 고릅니다.',
 x:'<strong>한 걸음 더</strong> 촬영 기록은 S#2 C#3 T#4(신2, 컷3, 테이크4)처럼 적습니다. AI 영상에서는 같은 프롬프트로 여러 번 생성하는 것이 테이크와 같아요. 크레딧을 생각해 2~3번 안에서 고르세요.',

{cat:'ai',lv:2,ko:'업스케일',en:'Upscale',b:'작은 해상도',a:'크게 다시 그려 선명하게',

{cat:'code',lv:2,ko:'스미어',en:'Smear Frame',b:'빠른데 그대로',a:'늘어난 한 장으로 속도감',anim:1,

{cat:'code',lv:2,ko:'할레이션',en:'Halation',b:'빛이 딱 끊김',a:'빛 주변이 번짐',

{cat:'code',lv:2,ko:'필름 그레인',en:'Film Grain',b:'깨끗한 디지털',a:'자글자글한 필름 입자',anim:1,
 d:'필름 특유의 미세한 입자입니다. 매 프레임 조금씩 달라져서 살아 있는 느낌을 주고, 디지털 그림을 덜 차갑게 만들어요.',

{cat:'code',lv:2,ko:'라인 보일',en:'Line Boil',b:'선이 완전히 고정',a:'선이 미세하게 꿈틀',anim:1,

/* =====================================================================
   화면 구성
   ===================================================================== */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const DPR=Math.min(2,window.devicePixelRatio||1);
const main=document.getElementById('main'),cats=document.getElementById('cats');
const cards=[],anims=[];
function paintCanvas(cv,term,after,t){const c=cv.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,CW,CH);c.save();c.beginPath();c.rect(0,0,CW,CH);c.clip();try{term.draw(c,after,t);}catch(e){console.error(term.ko,e);}c.restore();}
CATS.forEach(cat=>{
  const sec=document.createElement('section');sec.className='gsec';sec.id=cat.id;
  sec.innerHTML=`<h2>${cat.name}<small>${cat.en}</small></h2><div class="ggrid"></div>`;
  const grid=sec.querySelector('.ggrid');
  TERMS.filter(t=>t.cat===cat.id).sort((a,b)=>a.lv-b.lv).forEach(t=>{
    const el=document.createElement('article');el.className='term'+(t.lv===2?' adv':'');
    el.innerHTML=`<h3><span>${t.ko}<span class="en">${t.en}</span></span>${t.lv===2?'<span class="badge-adv">심화</span>':''}</h3>
      <div class="pair"><figure><canvas role="img" aria-label="${t.ko} 적용 전"></canvas><figcaption><b>BEFORE</b>${t.b}</figcaption></figure>
      <figure class="after"><canvas role="img" aria-label="${t.ko} 적용 후"></canvas><figcaption><b>AFTER</b>${t.a}</figcaption></figure></div>
      <p>${t.d}</p>${t.t?`<p class="tip"><strong>팁</strong> ${t.t}</p>`:''}${t.x?`<p class="more">${t.x}</p>`:''}`;
    const [c0,c1]=el.querySelectorAll('canvas');for(const cv of [c0,c1]){cv.width=CW*DPR;cv.height=CH*DPR;}
    paintCanvas(c0,t,false,.9);paintCanvas(c1,t,true,.9);
    if(t.anim)anims.push({el,c0,c1,t,vis:false});
    cards.push({el,t,sec});grid.appendChild(el);
  });
  main.appendChild(sec);
});
/* 움직이는 그림: 화면에 보이는 카드만 그림, 움직임 줄이기 설정이면 멈춤 */
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!still&&anims.length){
  const io=new IntersectionObserver(es=>es.forEach(e=>{const a=anims.find(v=>v.el===e.target);if(a)a.vis=e.isIntersecting;}),{rootMargin:'100px'});
  anims.forEach(a=>io.observe(a.el));
  let last=0;(function tick(now){if(now-last>40){last=now;const t=now/1000;for(const a of anims){if(!a.vis||a.el.offsetParent===null)continue;paintCanvas(a.c0,a.t,false,t);paintCanvas(a.c1,a.t,true,t);}}requestAnimationFrame(tick);})(0);
}
/* 기초 / 심화 */
const nB=TERMS.filter(t=>t.lv===1).length,nA=TERMS.filter(t=>t.lv===2).length,nX=TERMS.filter(t=>t.x).length;
document.getElementById('cBasic').textContent=nB;document.getElementById('cAdv').textContent='+'+nA;
let level='basic';
try{if(localStorage.getItem('vg:glossLevel')==='adv')level='adv';}catch(e){}
function setLevel(l){level=l;document.body.classList.toggle('adv',l==='adv');
  document.getElementById('bBasic').setAttribute('aria-pressed',l==='basic');document.getElementById('bAdv').setAttribute('aria-pressed',l==='adv');
  document.getElementById('lvnote').innerHTML=l==='adv'?`기초 ${nB}개에 <b>심화 용어 ${nA}개</b>가 더해지고, 기초 카드 ${nX}개에 <b>"한 걸음 더"</b> 설명이 붙었어요.`:`연수에서 꼭 쓰는 기초 용어 ${nB}개입니다. <b>심화</b>를 누르면 여기에 내용이 더해져요.`;
  try{localStorage.setItem('vg:glossLevel',l);}catch(e){}filter();}
document.getElementById('bBasic').onclick=()=>setLevel('basic');document.getElementById('bAdv').onclick=()=>setLevel('adv');
/* 분류 칩 + 찾기 */
const q=document.getElementById('q');
function filter(){const s=q.value.trim().toLowerCase();
  for(const c of cards){const txt=(c.t.ko+' '+c.t.en+' '+c.t.d+' '+(c.t.x||'')).toLowerCase();c.el.classList.toggle('hit-none',!!s&&!txt.includes(s));}
  cats.innerHTML='';CATS.forEach(cat=>{const sec=document.getElementById(cat.id);const vis=cards.filter(c=>c.t.cat===cat.id&&!c.el.classList.contains('hit-none')&&(level==='adv'||c.t.lv===1)).length;sec.classList.toggle('empty',vis===0);
    if(vis){const a=document.createElement('a');a.href='#'+cat.id;a.innerHTML=`${cat.name}<span class="n">${vis}</span>`;cats.appendChild(a);}});}
q.addEventListener('input',filter);
setLevel(level);
</script>
